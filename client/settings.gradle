pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'rustyclient'

['26.1', '26.2', '26.3'].each { mc ->
	def name = 'mc' + mc.replace('.', '')
	include name
	project(":$name").projectDir = file("versions/$mc")
}
