[package]
name = "RustyClient"
version = "1.0.2"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "RustyClient"
path = "src/main.rs"

[features]
default = []
portable = ["dep:bzip2", "dep:tar"]
setup = ["dep:windows", "dep:bzip2", "dep:tar"]

[dependencies]
cef = { version = "=151.8.0", default-features = false }
cef-dll-sys = { version = "=151.8.0", default-features = false }
zstd = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "gzip", "form", "charset", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
bzip2 = { version = "0.6", optional = true }
tar = { version = "0.4", optional = true, default-features = false }
windows = { version = "0.62", optional = true, features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
zstd = { version = "0.13", default-features = false }
sha1 = "0.10"
hex = "0.4"
serde_json = "1"
